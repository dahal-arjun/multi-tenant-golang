# One-command local dev: copy .env from .env.example, then:
#   docker compose up --build
# or:
#   make up-local
# (No service names — starts postgres, migrate, api, and adminer together.)
#
# API: http://localhost:${SERVER_PORT:-5000}  ·  Swagger: /swagger/index.html
# Adminer: http://localhost:${ADMINER_PORT:-8080}  ·  Postgres: localhost:${DB_FORWARD_PORT:-5432}

name: multi-tenant

services:
  postgres:
    image: postgres:16-alpine
    container_name: multi-tenant-pg
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-app}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  migrate:
    image: arigaio/atlas:latest
    working_dir: /src
    volumes:
      - .:/src
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - migrate
      - apply
      - --dir
      - file://migrations
      - --url
      - postgres://${DB_USER:-postgres}:${DB_PASS:-postgres}@postgres:5432/${DB_NAME:-app}?sslmode=disable&search_path=public
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: multi-tenant-api
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      SERVER_PORT: "5000"
    ports:
      - "${SERVER_PORT:-5000}:5000"
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        set -e
        go mod download
        exec go run . app:serve

  adminer:
    image: adminer:4
    container_name: multi-tenant-adminer
    environment:
      # Pre-fills “Server” on the login form (use service name on the Docker network).
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
