basePath: /
definitions:
  auth.AcceptInviteRequest:
    properties:
      password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  auth.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  auth.CreateTenantInviteRequest:
    properties:
      email:
        type: string
      role:
        type: string
      tenant_role_id:
        type: string
    required:
    - email
    - role
    type: object
  auth.CreateTenantRequest:
    properties:
      tenant_name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - tenant_name
    type: object
  auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.ForgotPasswordResponse:
    properties:
      message:
        type: string
      reset_token:
        type: string
    type: object
  auth.LoginDiscoveryResponse:
    properties:
      pick_tenant_expires_in:
        type: integer
      pick_tenant_token:
        type: string
      platform_access_token:
        type: string
      platform_expires_in:
        type: integer
      platform_refresh_token:
        type: string
      tenants:
        items:
          $ref: '#/definitions/auth.TenantChoice'
        type: array
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LogoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.MeResponse:
    properties:
      is_active:
        type: boolean
      is_email_verified:
        type: boolean
      permissions:
        items:
          type: string
        type: array
      tenant_id:
        type: string
      tenant_role:
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      tenant_name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - email
    - password
    - tenant_name
    type: object
  auth.ResendVerificationRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  auth.ResendVerificationResponse:
    properties:
      message:
        type: string
      verification_token:
        type: string
    type: object
  auth.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  auth.SignupRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  auth.SignupResponse:
    properties:
      message:
        type: string
      verification_token:
        type: string
    type: object
  auth.TenantChoice:
    properties:
      name:
        type: string
      role:
        type: string
      slug:
        type: string
      tenant_id:
        type: string
    type: object
  auth.TenantInviteResponse:
    properties:
      invite_token:
        type: string
      message:
        type: string
    type: object
  auth.TenantSessionRequest:
    properties:
      tenant_id:
        type: string
    required:
    - tenant_id
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  auth.UpdateMeRequest:
    properties:
      first_name:
        type: string
      first_name_ja:
        type: string
      last_name:
        type: string
      last_name_ja:
        type: string
    type: object
  auth.UserResponse:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      role:
        type: string
      uuid:
        type: string
    type: object
  auth.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  models.TenantRole:
    properties:
      created_at:
        type: string
      created_by_id:
        type: integer
      deleted_by_id:
        type: integer
      description:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
      tenant_id:
        type: string
      updated_at:
        type: string
      updated_by_id:
        type: integer
    type: object
  models.Widget:
    properties:
      created_at:
        type: string
      created_by_id:
        type: integer
      deleted_by_id:
        type: integer
      id:
        type: string
      tenant_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
      updated_by_id:
        type: integer
    type: object
  platform.TenantSummary:
    properties:
      tenant_count:
        type: integer
      user_count:
        type: integer
    type: object
  tenantroles.AssignMemberTenantRoleRequest:
    properties:
      tenant_role_id:
        type: string
      user_id:
        type: integer
    required:
    - user_id
    type: object
  tenantroles.CreateTenantRoleRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      slug:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  tenantroles.SetTenantRolePermissionsRequest:
    properties:
      permissions:
        items:
          type: string
        type: array
    required:
    - permissions
    type: object
  tenantroles.UpdateTenantRoleRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
    type: object
host: localhost:5000
info:
  contact: {}
  description: 'Base template: PostgreSQL RLS, JWT auth, clean architecture.'
  title: Multi-tenant API
  version: "1.0"
paths:
  /api/auth/accept-invite:
    post:
      consumes:
      - application/json
      description: New invitees create their account; existing users must provide
        their current password.
      parameters:
      - description: Invite token and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.AcceptInviteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
      summary: Accept tenant invitation
      tags:
      - auth
  /api/auth/change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Passwords
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Change password (authenticated)
      tags:
      - auth
  /api/auth/create-tenant:
    post:
      consumes:
      - application/json
      description: 'Authorization: Bearer pick_tenant_token from POST /auth/login
        when the user has no tenant memberships yet.'
      parameters:
      - description: Bearer {pick_tenant_token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.CreateTenantRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.TokenResponse'
      summary: Create first organization after signup (pick_tenant_token)
      tags:
      - auth
  /api/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: In ENVIRONMENT=local the response may include reset_token for testing.
        In production, send the token via your own channel (e.g. email).
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ForgotPasswordResponse'
      summary: Request password reset
      tags:
      - auth
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Requires a verified email. Returns tenant list and pick_tenant_token
        (also when tenants is empty, for POST /auth/create-tenant). For users with
        role admin or system_manager, may also return platform_access_token and platform_refresh_token
        for /api/platform/*. Call POST /auth/tenant-session with Bearer pick_tenant_token
        and JSON tenant_id to obtain tenant access_token and refresh_token.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginDiscoveryResponse'
      summary: Login (discover tenants)
      tags:
      - auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MeResponse'
      security:
      - BearerAuth: []
      summary: Current user
      tags:
      - auth
    patch:
      consumes:
      - application/json
      parameters:
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.UpdateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.MeResponse'
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
      summary: Refresh tokens
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a verified user, tenant, and owner membership in one step.
        Prefer POST /auth/signup for self-serve users who verify email before creating
        an organization.
      parameters:
      - description: Registration
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.TokenResponse'
      summary: Register user and tenant (bootstrap)
      tags:
      - auth
  /api/auth/resend-verification:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ResendVerificationResponse'
      summary: Resend email verification (rate-limited)
      tags:
      - auth
  /api/auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Token and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Complete password reset
      tags:
      - auth
  /api/auth/signup:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.SignupResponse'
      summary: Self-serve signup (email verification required)
      tags:
      - auth
  /api/auth/tenant-session:
    post:
      consumes:
      - application/json
      description: 'Authorization: Bearer pick_tenant_token from POST /auth/login
        (not the final access token).'
      parameters:
      - description: Bearer {pick_tenant_token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tenant to use
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.TenantSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.TokenResponse'
      summary: Open session for a tenant
      tags:
      - auth
  /api/auth/verify-email:
    post:
      consumes:
      - application/json
      parameters:
      - description: Verification token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      summary: Verify email with token from signup or resend
      tags:
      - auth
  /api/invites:
    post:
      consumes:
      - application/json
      description: Requires access token with tenant context; only owner or admin.
      parameters:
      - description: Invitee email and tenant role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.CreateTenantInviteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.TenantInviteResponse'
      security:
      - BearerAuth: []
      summary: Invite user to current tenant by email
      tags:
      - auth
  /api/platform/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Platform API health (authenticated)
      tags:
      - platform
  /api/platform/tenants/summary:
    get:
      description: Requires a platform access token (from login for system_manager/admin).
        Does not use tenant RLS.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/platform.TenantSummary'
      security:
      - BearerAuth: []
      summary: Cross-tenant counts for operators
      tags:
      - platform
  /api/tenant-members/role:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Target user and role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tenantroles.AssignMemberTenantRoleRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Assign a custom tenant role to a member
      tags:
      - tenant-roles
  /api/tenant-roles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.TenantRole'
            type: array
      security:
      - BearerAuth: []
      summary: List tenant-defined roles
      tags:
      - tenant-roles
    post:
      consumes:
      - application/json
      parameters:
      - description: Role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tenantroles.CreateTenantRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.TenantRole'
      security:
      - BearerAuth: []
      summary: Create a tenant role
      tags:
      - tenant-roles
  /api/tenant-roles/{id}:
    delete:
      parameters:
      - description: Role UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Delete a tenant role
      tags:
      - tenant-roles
    patch:
      consumes:
      - application/json
      parameters:
      - description: Role UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tenantroles.UpdateTenantRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TenantRole'
      security:
      - BearerAuth: []
      summary: Update a tenant role
      tags:
      - tenant-roles
  /api/tenant-roles/{id}/permissions:
    put:
      consumes:
      - application/json
      parameters:
      - description: Role UUID
        in: path
        name: id
        required: true
        type: string
      - description: Permission keys
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tenantroles.SetTenantRolePermissionsRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Replace permissions for a tenant role
      tags:
      - tenant-roles
  /api/widgets:
    get:
      description: Rows are filtered by PostgreSQL RLS using the tenant from the JWT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Widget'
            type: array
      security:
      - BearerAuth: []
      summary: List widgets for current tenant
      tags:
      - widgets
  /health-check:
    get:
      description: Liveness probe
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
